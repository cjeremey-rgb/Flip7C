<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Flip Rush 7 Multiplayer</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient"><i></i><i></i><i></i></div><main><section id="home"><div class="panel"><h1>FLIP <b>RUSH 7</b></h1><p>Online multiplayer · official 3–9 player limit</p><input id="name" placeholder="Player name"><button id="create" class="primary">CREATE ROOM</button><input id="roomCode" maxlength="6" placeholder="ROOM CODE"><button id="join" class="secondary">JOIN ROOM</button><div id="err"></div></div></section><section id="game" class="hidden"><header><button id="leave">‹</button><div>ROOM <b id="code">------</b></div><div>ROUND <b id="round">0</b></div></header><div id="status" class="status"></div><div id="players" class="players"></div><div id="lobby" class="panel"></div><div id="table" class="table hidden"><div class="deck">7</div><div id="myhand" class="hand"></div><div>Round value: <b id="value">0</b></div></div><div id="reactionOverlay" class="reaction-overlay hidden"><div id="reactionName" class="reaction-name"></div><div id="reactionText" class="reaction-text"></div></div><div id="target" class="target hidden"></div><div class="reaction-dock"><button id="reactionToggle" class="reaction-main" aria-label="Reactions">☺</button><div id="reactionMenu" class="reaction-menu hidden"><div class="emoji-row"><button data-emoji="😂">😂</button><button data-emoji="😮">😮</button><button data-emoji="😭">😭</button><button data-emoji="😡">😡</button><button data-emoji="👍">👍</button><button data-emoji="👏">👏</button></div><div class="phrase-list"><button data-phrase="You suck!">You suck!</button><button data-phrase="You’re a peckerhead!">You’re a peckerhead!</button><button data-phrase="You got lucky!">You got lucky!</button><button data-phrase="So close">So close</button><button data-phrase="Tough Break!">Tough Break!</button></div></div></div><div class="actions"><button id="hit" class="primary">FLIP</button><button id="stay" class="secondary">STAY</button><button id="start" class="primary hidden">START GAME</button><button id="next" class="primary hidden">NEXT ROUND</button></div><div id="log" class="log"></div></section></main><script src="client.js"></script></body></html>
