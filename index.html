<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#08101d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Flip Rush 7</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="online.css">
  <style>
    .mode-panel{padding:20px}
    .mode-link{display:flex;min-height:72px;align-items:center;justify-content:center;flex-direction:column;text-decoration:none;text-align:center;border-radius:17px;padding:14px;transition:transform .16s ease,filter .16s ease}
    .mode-link:active{transform:translateY(4px)}
    .mode-link span{display:block;font-weight:900;letter-spacing:.04em}
    .mode-link small{display:block;margin-top:4px;opacity:.68;font-size:10px}
    .mode-link.secondary{color:#fff;box-shadow:0 5px 0 #07101a}
    .mode-panel .divider{margin:19px 0}
  </style>
</head>
<body>
<div class="ambient"><i></i><i></i><i></i></div>
<div id="seasonalLayer" class="seasonal-layer" aria-hidden="true"></div>
<div id="seasonBadge" class="season-badge"></div>
<main>
  <section id="home" class="screen active">
    <nav class="topbar"><span></span><span></span></nav>
    <div class="hero">
      <span class="kicker">CHOOSE YOUR GAME</span>
      <div class="logo" aria-label="Flip Rush 7"><span>FLIP</span><strong>RUSH</strong><b>7</b></div>
      <p>Draw boldly. Bank wisely. Be the first to seven unique numbers.</p>
      <div class="card-splash" aria-hidden="true"><div class="mini-card c4">4</div><div class="mini-card c7">7</div><div class="mini-card cx">×2</div></div>
    </div>
    <div class="panel mode-panel">
      <a href="offline.html" class="primary mode-link" id="singlePlayer">
        <span>SINGLE PLAYER</span>
        <small>Play against computer players</small>
      </a>
      <div class="divider"><span>OR</span></div>
      <a href="online.html" class="secondary mode-link" id="multiPlayer">
        <span>MULTIPLAYER</span>
        <small>Create or join a private room</small>
      </a>
    </div>
    <footer>Choose a mode to start playing</footer>
  </section>
</main>
<script>
function applyFlipRushTheme(){
 const params=new URLSearchParams(location.search);
 let theme=(params.get('theme')||'neon').toLowerCase();
 if(theme==='seasonal'||theme==='auto'){
  const now=new Date(),m=now.getMonth()+1,d=now.getDate();
  if((m===12)||(m===1&&d<=6))theme='christmas';
  else if(m>=3&&m<=5)theme='spring';
  else if(m>=6&&m<=8)theme='summer';
  else if(m>=9&&m<=11)theme='autumn';
  else theme='winter';
 }
 const allowed=['neon','spring','summer','autumn','winter','christmas'];
 if(!allowed.includes(theme))theme='neon';
 const info={
  neon:{label:'Neon Circuit',icon:'\u26a1',count:20},
  spring:{label:'Spring Table',icon:'\ud83c\udf38',count:16},
  summer:{label:'Summer Table',icon:'\u2600\ufe0f',count:10},
  autumn:{label:'Autumn Table',icon:'\ud83c\udf42',count:18},
  winter:{label:'Winter Table',icon:'\u2744\ufe0f',count:22},
  christmas:{label:'Christmas Table',icon:'\ud83c\udf84',count:24}
 }[theme];
 document.body.dataset.season=theme;
 const meta=document.querySelector('meta[name="theme-color"]');
 if(meta)meta.setAttribute('content',getComputedStyle(document.body).backgroundColor||'#07101d');
 const badge=document.getElementById('seasonBadge');
 if(badge)badge.innerHTML='<span>'+info.icon+'</span>'+info.label;
 const layer=document.getElementById('seasonalLayer');
 if(!layer)return;
 layer.innerHTML='';
 for(let i=0;i<info.count;i++){
  const el=document.createElement('i');
  let glyph='\u2022';
  if(theme==='neon')glyph=Math.random()>.42?'\u2726':'\u2022';
  if(theme==='christmas')glyph=Math.random()>.35?'\u2744':'\u2726';
  if(theme==='spring')glyph=Math.random()>.35?'\u273f':'\u2022';
  if(theme==='summer')glyph=Math.random()>.55?'\u2726':'\u2022';
  if(theme==='autumn')glyph=Math.random()>.5?'\ud83c\udf41':'\ud83c\udf42';
  if(theme==='winter')glyph='\u2744';
  el.textContent=glyph;
  el.style.left=Math.random()*100+'vw';
  el.style.fontSize=(theme==='summer'?5+Math.random()*7:theme==='neon'?6+Math.random()*10:9+Math.random()*13)+'px';
  el.style.animationDuration=(theme==='neon'?7+Math.random()*10:8+Math.random()*12)+'s';
  el.style.animationDelay=(-Math.random()*18)+'s';
  el.style.setProperty('--drift',(-45+Math.random()*90)+'px');
  if(theme==='neon')el.style.color=['#32e5cb','#ffdd42','#ff4f8b','#74dfff'][i%4];
  if(theme==='spring')el.style.color=Math.random()>.5?'#ff9ec0':'#fff1a8';
  if(theme==='summer')el.style.color=Math.random()>.5?'#ffe36a':'#8cf1ff';
  if(theme==='winter'||theme==='christmas')el.style.color='#fff';
  layer.appendChild(el);
 }
}
applyFlipRushTheme();
const requestedTheme=new URLSearchParams(location.search).get('theme');
if(requestedTheme){
 document.querySelectorAll('.mode-link').forEach(link=>{
  const href=link.getAttribute('href');
  link.setAttribute('href',href+(href.includes('?')?'&':'?')+'theme='+encodeURIComponent(requestedTheme));
 });
}
</script>
</body>
</html>
