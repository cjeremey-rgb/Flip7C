<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#08101d"><title>Flip Rush 7 — Single Player</title>
  <link rel="manifest" href="manifest.json"><link rel="stylesheet" href="online.css">
</head>
<body class="offline">
<div class="ambient"><i></i><i></i><i></i></div>
<main>
  <section id="home" class="screen active">
    <nav class="topbar"><a href="index.html" class="icon-btn mode-back" aria-label="Back to mode selection">‹</a><span class="topbar-spacer"></span><button id="howBtn" class="icon-btn" aria-label="How to play">?</button><button id="soundBtn" class="icon-btn" aria-label="Sound">♪</button></nav>
    <div class="hero"><span class="kicker">SINGLE PLAYER</span><div class="logo"><span>FLIP</span><strong>RUSH</strong><b>7</b></div><p>Play against two computer opponents using the same rules as multiplayer.</p><div class="card-splash"><div class="mini-card c4">4</div><div class="mini-card c7">7</div><div class="mini-card cx">×2</div></div></div>
    <div class="panel join-panel"><label>PLAYER NAME<input id="name" maxlength="18" autocomplete="nickname" placeholder="Enter your name"></label><button id="play" class="primary big"><span>PLAY</span><small>Start a new game</small></button><p id="error" role="alert"></p></div>
  </section>

  <section id="game" class="screen">
    <header class="game-head"><a href="index.html" class="icon-btn" aria-label="Back to mode selection">‹</a><div class="room-pill"><small>MODE</small><b>SOLO</b></div><div class="round-pill"><small>ROUND</small><b id="round">0</b></div><button id="menuBtn" class="icon-btn" aria-label="Game menu">•••</button></header>
    <div id="status" class="status"><span class="pulse"></span><b>GET READY</b><small>Flip or Stay when it is your turn</small></div>
    <div id="players" class="players"></div>

    <div id="table" class="table">
      <div class="felt-mark">FLIP RUSH</div>
      <div id="botTable" class="bot-table"></div>
      <div class="deck-zone"><button id="deckVisual" class="deck" aria-label="Deck"><div class="card back"><span>7</span></div><div class="card back ghost g1"></div><div class="card back ghost g2"></div></button><small><b id="deckCount">94</b> LEFT</small></div>
      <div id="myArea" class="my-area"></div>
      <div id="scorePreview" class="score-preview"><small>ROUND VALUE</small><b>0</b></div>
    </div>

    <div id="targetPicker" class="target-picker hidden"></div>
    <div id="actions" class="actions">
      <button id="react" class="react-btn" disabled>☺</button>
      <button id="hit" class="primary decision"><span>FLIP</span><small>Draw one card</small></button>
      <button id="stay" class="decision"><span>STAY</span><small>Bank your points</small></button>
      <button id="next" class="primary decision hidden"><span>NEXT ROUND</span><small>Deal again</small></button>
    </div>
    <details class="game-log"><summary>GAME FEED</summary><div id="log" class="log"></div></details>
  </section>
</main>

<div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="modal-close">×</button><div id="modalBody"></div></div></div>
<div id="toast"></div><div id="confetti"></div>
<script src="offline.js?v=20260818-restored"></script>
</body></html>
